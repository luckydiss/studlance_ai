run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - gofumpt
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

linters-settings:
  gofumpt:
    extra-rules: true