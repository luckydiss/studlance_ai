openapi: 3.1.0
info:
  title: Studlance API
  version: 0.1.0
  description: >
    Контракт API Studlance (MVP). Источник правды - docs/specs/04-api.md.
    Go-сервер и TS-клиент генерируются из этого файла.
servers:
  - url: http://127.0.0.1:8080
    description: локальный сервер MVP

tags:
  - name: auth
  - name: client
  - name: admin
  - name: worker

paths:
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Вход по email и паролю
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешный вход, ставит cookie sl_session
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Выход
      responses:
        "204":
          description: Сессия удалена, cookie очищена
  /api/auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Текущий пользователь
      responses:
        "200":
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/client/jobs:
    get:
      tags: [client]
      operationId: clientListJobs
      summary: Список заказов клиента
      responses:
        "200":
          description: Заказы новые сверху
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [client]
      operationId: clientCreateJob
      summary: Создать заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: Заказ создан (uploading)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/client/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [client]
      operationId: clientGetJob
      summary: Карточка заказа
      responses:
        "200":
          description: Карточка заказа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/client/jobs/{id}/input:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/InputPath"
    put:
      tags: [client]
      operationId: clientUploadInput
      summary: Загрузить файл (только uploading)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    delete:
      tags: [client]
      operationId: clientDeleteInput
      summary: Удалить загруженный файл (только uploading)
      responses:
        "204":
          description: Файл удалён
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/client/jobs/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [client]
      operationId: clientSubmitJob
      summary: Отправить заказ (uploading -> queued)
      responses:
        "200":
          description: Заказ принят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/client/jobs/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [client]
      operationId: clientAnswerJob
      summary: Ответить на вопрос агента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Ответ принят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/client/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [client]
      operationId: clientCancelJob
      summary: Отменить заказ
      responses:
        "200":
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/client/jobs/{id}/revisions:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [client]
      operationId: clientCreateRevision
      summary: Отправить на доработку (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  description: JSON с комментарием и замечаниями
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Доработка принята
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientJobDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/client/jobs/{id}/versions/{v}/documents/{document_id}/pages:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [client]
      operationId: clientListVersionPages
      summary: Страницы документа версии
      responses:
        "200":
          description: Страницы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/client/jobs/{id}/versions/{v}/pages/{document_id}/{page}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/PageNumber"
    get:
      tags: [client]
      operationId: clientGetVersionPage
      summary: Картинка страницы
      responses:
        "200":
          description: PNG страницы
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/client/jobs/{id}/versions/{v}/thumbs/{document_id}/{page}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/PageNumber"
    get:
      tags: [client]
      operationId: clientGetVersionThumb
      summary: Мини-копия страницы
      responses:
        "200":
          description: PNG мини-копии
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/client/jobs/{id}/versions/{v}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Путь файла в комплекте
    get:
      tags: [client]
      operationId: clientGetVersionFile
      summary: Скачать файл комплекта
      responses:
        "200":
          description: Файл
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/client/jobs/{id}/versions/{v}/bundle.zip:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
    get:
      tags: [client]
      operationId: clientGetVersionBundle
      summary: Архив комплекта версии
      responses:
        "200":
          description: ZIP-архив
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/client/jobs/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [client]
      operationId: clientJobStream
      summary: SSE-поток заказа
      responses:
        "200":
          description: text/event-stream (snapshot, job, ping)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/jobs:
    get:
      tags: [admin]
      operationId: adminListJobs
      summary: Список заказов
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: attention
          in: query
          schema:
            type: integer
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Заказы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/admin/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [admin]
      operationId: adminGetJob
      summary: Карточка заказа
      responses:
        "200":
          description: Карточка заказа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/runs/{run_id}/steps:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: run_id
        in: path
        required: true
        schema:
          type: string
      - name: after_seq
        in: query
        schema:
          type: integer
    get:
      tags: [admin]
      operationId: adminGetRunSteps
      summary: Шаги запуска агента
      responses:
        "200":
          description: Шаги трейса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceStepList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/runs/{run_id}/log:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [admin]
      operationId: adminGetRunLog
      summary: Сырой JSONL лог агента
      responses:
        "200":
          description: JSONL
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/answer:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [admin]
      operationId: adminAnswerJob
      summary: Ответить за клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
      responses:
        "200":
          description: Ответ принят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/jobs/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [admin]
      operationId: adminRetryJob
      summary: Повторить failed заказ
      responses:
        "200":
          description: Заказ повторён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/jobs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [admin]
      operationId: adminCancelJob
      summary: Отменить заказ
      responses:
        "200":
          description: Заказ отменён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/jobs/{id}/attention:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [admin]
      operationId: adminSetAttention
      summary: Снять флаг внимания
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttentionRequest"
      responses:
        "200":
          description: Флаг обновлён
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/JobId"
    post:
      tags: [admin]
      operationId: adminCreateNote
      summary: Добавить заметку
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "201":
          description: Заметка создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [admin]
      operationId: adminJobStream
      summary: SSE-поток заказа (события и шаги трейса)
      responses:
        "200":
          description: text/event-stream (snapshot, job, steps, ping)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/draft/documents/{document_id}/pages:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [admin]
      operationId: adminListDraftPages
      summary: Страницы документа черновика
      responses:
        "200":
          description: Страницы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/draft/pages/{document_id}/{page}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/PageNumber"
    get:
      tags: [admin]
      operationId: adminGetDraftPage
      summary: Картинка страницы черновика
      responses:
        "200":
          description: PNG страницы
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/draft/thumbs/{document_id}/{page}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/PageNumber"
    get:
      tags: [admin]
      operationId: adminGetDraftThumb
      summary: Мини-копия страницы черновика
      responses:
        "200":
          description: PNG мини-копии
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/draft/files/{path}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Путь файла черновика (один сегмент, %2F для вложенности)
    get:
      tags: [admin]
      operationId: adminGetDraftFile
      summary: Скачать файл черновика
      responses:
        "200":
          description: Файл
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/versions/{v}/documents/{document_id}/pages:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [admin]
      operationId: adminListVersionPages
      summary: Страницы документа версии (включая незавершённую)
      responses:
        "200":
          description: Страницы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/versions/{v}/pages/{document_id}/{page}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/PageNumber"
    get:
      tags: [admin]
      operationId: adminGetVersionPage
      summary: Картинка страницы версии
      responses:
        "200":
          description: PNG страницы
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/versions/{v}/thumbs/{document_id}/{page}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/PageNumber"
    get:
      tags: [admin]
      operationId: adminGetVersionThumb
      summary: Мини-копия страницы версии
      responses:
        "200":
          description: PNG мини-копии
          content:
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/versions/{v}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/JobId"
      - $ref: "#/components/parameters/VersionPath"
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: Путь файла в комплекте (один сегмент, %2F для вложенности)
    get:
      tags: [admin]
      operationId: adminGetVersionFile
      summary: Скачать файл комплекта (без проверки владельца)
      responses:
        "200":
          description: Файл
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/jobs/{id}/versions/{v}/bundle.zip:
