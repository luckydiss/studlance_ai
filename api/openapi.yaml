components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sl_session
    workerToken:
      type: http
      scheme: bearer

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
    VersionPath:
      name: v
      in: path
      required: true
      schema:
        type: integer
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    PageNumber:
      name: page
      in: path
      required: true
      schema:
        type: string
    InputPath:
      name: path
      in: query
      required: true
      schema:
        type: string
    EpochQuery:
      name: epoch
      in: query
      required: true
      schema:
        type: integer
    Snapshot:
      name: snapshot
      in: path
      required: true
      schema:
        type: string
        pattern: "^(draft|v[0-9]+)$"

  responses:
    BadRequest:
      description: Неверное тело или параметры
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Нет сессии или неверный токен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Не та роль или не совпал Origin
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Объект не найден или чужой
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Недопустимый переход статуса
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    StaleLease:
      description: Устаревший lease
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooLarge:
      description: Превышен лимит загрузки
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Слишком много попыток входа
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [client, admin]
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CreateJobRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
    AnswerRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 10000
    AttentionRequest:
      type: object
      required: [needs_attention]
      properties:
        needs_attention:
          type: boolean
    NoteRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
    UploadResult:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
        size:
          type: integer

    StatusStep:
      type: object
      required: [title, state]
      properties:
        title:
          type: string
        state:
          type: string
          enum: [done, active, pending]

    JobSummary:
      type: object
      required: [id, title, client_status, status_text, current_version, created_at, updated_at]
      properties:
        id:
          type: string
        title:
          type: string
        client_status:
          type: string
          enum: [uploading, accepted, in_progress, revising, needs_input, done, delayed, canceled]
        status_text:
          type: string
        current_version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClientJobDetail:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          required:
            - prompt
            - status_steps
            - input_files
            - versions
            - planned_documents
            - revisions
            - can_cancel
            - can_revise
            - can_answer
          properties:
            prompt:
              type: string
            question:
              type: string
            status_steps:
              type: array
              items:
                $ref: "#/components/schemas/StatusStep"
            input_files:
              type: array
              items:
                $ref: "#/components/schemas/InputFile"
            versions:
              type: array
              items:
                $ref: "#/components/schemas/Version"
            planned_documents:
              type: array
              items:
                $ref: "#/components/schemas/PlannedDocument"
            revisions:
              type: array
              items:
                $ref: "#/components/schemas/Revision"
            can_cancel:
              type: boolean
            can_revise:
              type: boolean
            can_answer:
              type: boolean

    InputFile:
      type: object
      required: [path, size]
      properties:
        path:
          type: string
        size:
          type: integer

    PlannedDocument:
      type: object
      required: [title, kind]
      properties:
        title:
          type: string
        kind:
          type: string

    Version:
      type: object
      required: [version, ready_at, documents]
      properties:
        version:
          type: integer
        ready_at:
          type: string
          format: date-time
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"

    Document:
      type: object
      required: [id, idx, title, kind, file_path, size, page_count, download_url]
      properties:
        id:
          type: string
        idx:
          type: integer
        title:
          type: string
        kind:
          type: string
        file_path:
          type: string
        size:
          type: integer
        page_count:
          type: integer
        download_url:
          type: string

    Page:
      type: object
      required: [page, width, height, image_url, thumb_url, changed_boxes]
      properties:
        page:
          type: integer
        width:
          type: integer
        height:
          type: integer
        image_url:
          type: string
        thumb_url:
          type: string
        changed_boxes:
          type: array
          items:
            $ref: "#/components/schemas/ChangedBox"

    ChangedBox:
      type: object
      required: [x, y, w, h]
      properties:
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number

    PageList:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            $ref: "#/components/schemas/Page"

    Revision:
      type: object
      required: [version, comment, created_at, completed_at, remarks]
      properties:
        version:
          type: integer
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        remarks:
          type: array
          items:
            $ref: "#/components/schemas/Remark"

    Remark:
      type: object
      required: [idx, document_id, page, x, y, w, h, text]
      properties:
        idx:
          type: integer
        document_id:
          type: string
        page:
          type: integer
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
        text:
          type: string

    ClientJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"

    ClientRef:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string

    AdminJobSummary:
      type: object
      required:
        - id
        - title
        - client
        - status
        - client_status
        - current_version
        - needs_attention
        - attempt
        - created_at
        - updated_at
      properties:
        id:
          type: string
        title:
          type: string
        client:
          $ref: "#/components/schemas/ClientRef"
        status:
          type: string
        stage:
          type: string
        client_status:
          type: string
        current_version:
          type: integer
        pending_revision:
          type: integer
        needs_attention:
          type: boolean
        attempt:
          type: integer
        worker:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminJobDetail:
      allOf:
        - $ref: "#/components/schemas/AdminJobSummary"
        - type: object
          required:
            - prompt
            - status_steps
            - input_files
            - versions
            - planned_documents
            - revisions
            - error
            - state
            - lease_epoch
            - agent_runs
            - events
            - notes
          properties:
            prompt:
              type: string
            question:
              type: string
