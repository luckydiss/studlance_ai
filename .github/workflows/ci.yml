name: CI

on:
  push:
    branches: [main, "pr*"]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: go mod download
        run: go mod download
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - name: go test
        run: go test -race ./...

  generate-check:
    name: Generate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install tools
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.28.0
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.4.1
      - name: install web deps
        run: pnpm -C web install --frozen-lockfile
      - name: generate
        run: make generate
      - name: check diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::generate produced changes; commit generated code";
            git diff;
            exit 1;
          fi

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm -C web install --frozen-lockfile
      - name: lint
        run: pnpm -C web lint
      - name: test
        run: pnpm -C web test
      - name: build
        run: pnpm -C web build

  build-windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: build production frontends
        run: pnpm -C web build
      - name: build exe with embedded frontends
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -o bin/studlance-server.exe ./cmd/server
          go build -o bin/studlance-worker.exe ./cmd/worker
      - name: smoke packaged Windows executables
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -BinDir ./bin
      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: studlance-windows
          if-no-files-found: error
          path: |
            bin/studlance-server.exe
            bin/studlance-worker.exe

  e2e:
    name: e2e (server + worker + fake agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: go test e2e
        run: go test -race -tags e2e -timeout 10m ./e2e/...
  web-e2e:
    name: Web e2e (Playwright, cabinet UI + server + worker + fake agents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: install web deps
        run: pnpm -C web install --frozen-lockfile
      - name: install playwright browsers
        run: pnpm -C web/e2e exec playwright install --with-deps chromium
      - name: playwright
        run: pnpm -C web/e2e run e2e
